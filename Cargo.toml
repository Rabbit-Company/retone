[package]
name = "retone"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false
description = "Measure, write, check and remove HDR10+ and HDR10 metadata in AV1 video"
readme = "README.md"
repository = "https://github.com/Rabbit-Company/retone"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
dolby_vision = "3.4.0"
hevc_parser = { version = "0.6.12", default-features = false }
rabbit-av1 = "0.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = true
